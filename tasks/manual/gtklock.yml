# only needed for fedora
- name: Check if gtklock is installed
  ansible.builtin.command: which gtklock
  register: gtklock_check
  changed_when: false
  ignore_errors: true

- name: Ensure build dependencies are installed
  when: gtklock_check is failed
  become: true
  ansible.builtin.dnf:
    name:
      - wayland-devel
      - gobject-introspection
      - gobject-introspection-devel
      - gtk-doc
      - vala
      - gcc
      - meson
      - pkgconf
      - scdoc
      - pam-devel
      - gtk3-devel
    state: present
    update_cache: true

- name: Clone the gtk session lock repository
  when: gtklock_check is failed
  ansible.builtin.git:
    repo: "https://github.com/Cu3PO42/gtk-session-lock.git"
    dest: "{{ ansible_env.HOME }}/Tools/gtk-session-lock"
    version: master
    force: true

- name: Build and install gtk-session-lock
  when: gtklock_check is failed
  ansible.builtin.shell: meson setup build && ninja -C build && sudo ninja -C build install && sudo ldconfig
  args:
    chdir: "{{ ansible_env.HOME }}/Tools/gtk-session-lock"

- name: Clone the gtklock repository
  when: gtklock_check is failed
  ansible.builtin.git:
    repo: "https://github.com/jovanlanik/gtklock.git"
    dest: "{{ ansible_env.HOME }}/Tools/gtklock"
    version: master
    force: true

- name: Build and install gtklock
  when: gtklock_check is failed
  ansible.builtin.shell: meson setup builddir && ninja -C builddir && sudo meson install -C builddir
  args:
    chdir: "{{ ansible_env.HOME }}/Tools/gtklock"
