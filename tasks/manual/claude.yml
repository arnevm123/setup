- name: Check if claude is installed
  changed_when: false
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/.local/bin/claude"
  register: claude_binary

- name: Download claude installer
  when: not claude_binary.stat.exists
  ansible.builtin.get_url:
    url: https://claude.ai/install.sh
    dest: /tmp/install-claude.sh
    mode: '0755'

- name: Install claude
  when: not claude_binary.stat.exists
  ansible.builtin.command: /bin/bash /tmp/install-claude.sh
  args:
    creates: "{{ ansible_env.HOME }}/.local/bin/claude"
